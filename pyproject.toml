[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-editor"
version = "0.15.1"
description = "繁體中文 Windows PDF 編輯器"
requires-python = ">=3.10"
dependencies = ["PyMuPDF==1.28.2", "PySide6-Essentials==6.8.3", "Pillow==12.3.0", "psutil==7.2.2", "fonttools==4.65.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
